name: Live Children of Vaelinya verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-children:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify deployed story hierarchy on origin and custom domain
        shell: bash
        run: |
          set -euo pipefail

          fetch_page() {
            local url="$1"
            local body="$2"
            curl \
              --silent \
              --show-error \
              --location \
              --user-agent 'Mozilla/5.0 (compatible; VaelinyaLiveStoryVerifier/1.0)' \
              --connect-timeout 10 \
              --max-time 30 \
              --output "$body" \
              --write-out '%{http_code}\n%{url_effective}\n' \
              "$url" 2>&1 || true
          }

          verify_page() {
            local url="$1"
            local marker="$2"
            local label="$3"
            local body metadata status effective_url
            body="$(mktemp)"

            for attempt in $(seq 1 30); do
              metadata="$(fetch_page "$url" "$body")"
              status="$(printf '%s\n' "$metadata" | tail -n 2 | head -n 1)"
              effective_url="$(printf '%s\n' "$metadata" | tail -n 1)"

              if [[ "$status" == "200" ]] && grep --fixed-strings --quiet "$marker" "$body"; then
                echo "$label PASS: status=200 url=$effective_url marker=$marker"
                rm -f "$body"
                return 0
              fi

              echo "$label attempt $attempt/30: status=${status:-unknown} url=${effective_url:-unknown} marker_found=$(grep --fixed-strings --quiet "$marker" "$body" && echo yes || echo no)"
              sleep 10
            done

            echo "::error::$label did not return HTTP 200 with required marker: $marker"
            printf '%s\n' "$metadata"
            head -c 1500 "$body" || true
            rm -f "$body"
            return 1
          }

          verify_set() {
            local base="$1"
            local label="$2"
            verify_page "$base/read/" 'Children of Vaelinya · 72 story pages' "$label read shelf"
            verify_page "$base/read/children-of-vaelinya/" 'Eight children. Eight stories each. Then eight adventures together.' "$label Children of Vaelinya parent"
            verify_page "$base/read/children-of-vaelinya/lina/" "Lina's eight stories" "$label Lina folder"
            verify_page "$base/read/children-of-vaelinya/fina/" "Fina's eight stories" "$label Fina folder"
            verify_page "$base/read/children-of-vaelinya/together/" 'Eight adventures together' "$label Together folder"
            verify_page "$base/read/children-of-vaelinya/together/08-the-house-with-one-welcome/" 'The House With One Welcome' "$label Together finale"
          }

          verify_set 'https://vaelinya-site.pages.dev' 'Cloudflare Pages origin'
          verify_set 'https://vaelinya.uk' 'vaelinya.uk custom domain'

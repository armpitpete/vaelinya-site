name: Complete short-story release

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  complete-release:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Stop if release is already generated
        id: generated
        shell: bash
        run: |
          if [[ -f src/data/short-story-release-v1.generated ]]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download accepted publication artifact
        if: steps.generated.outputs.done != 'true'
        shell: bash
        env:
          ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-24f8-81f4-ba2e-29cfe62a8d79/raw?se=2026-08-14T20%3A57%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=d66e7c35-4b81-5b67-99c5-128222b11b48&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-14T18%3A44%3A54Z&ske=2026-08-15T18%3A44%3A54Z&sks=b&skv=2026-02-06&sig=5PTnNnpAc4jd3E3yYABXjhjvc1/Ue/fHDAOI6le6wXI%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/publication.zip "$ARTIFACT_URL"
          rm -rf /tmp/publication
          mkdir -p /tmp/publication
          unzip -q /tmp/publication.zip -d /tmp/publication
          master="$(find /tmp/publication -name 'Vaelinya_Short_Story_Reading_Master_v1.0.md' -print -quit)"
          test -n "$master"
          printf '%s  %s\n' 'e8232dc87180ce91b9028780a9f56bdabfc297110a15ff0d2484c394fee53d56' "$master" | sha256sum --check --strict
          cp "$master" /tmp/Vaelinya_Short_Story_Reading_Master_v1.0.md

      - name: Generate and prove all 57 stories
        if: steps.generated.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, json, hashlib, unicodedata

          master = Path('/tmp/Vaelinya_Short_Story_Reading_Master_v1.0.md').read_text(encoding='utf-8')
          matches = list(re.finditer(r'^## (\d+)\. (.+)$', master, re.M))
          if len(matches) != 57:
              raise SystemExit(f'Expected 57 stories, found {len(matches)}')

          hero_pool = [
              '/images/read/fables/the-line-of-white-pebbles/hero.webp',
              '/images/read/fables/the-roof-that-waited-for-rain/hero.webp',
              '/images/read/fables/luma-and-the-grass-that-held-sens-place/hero.webp',
              '/images/read/fables/the-mountain-healers-who-would-not-help-their-own/hero.webp',
              '/images/begin-the-journey.webp',
              '/images/door-read.webp',
              '/images/lina-first-path.webp',
          ]

          def slugify(value):
              value = unicodedata.normalize('NFKD', value).encode('ascii', 'ignore').decode('ascii').lower()
              value = value.replace("'", '')
              return re.sub(r'[^a-z0-9]+', '-', value).strip('-')

          out = Path('src/content/stories/short-programme')
          out.mkdir(parents=True, exist_ok=True)
          for old in out.glob('*.md'):
              old.unlink()

          bodies = []
          for index, match in enumerate(matches):
              position = int(match.group(1))
              if position != index + 1:
                  raise SystemExit(f'Unexpected position {position} at index {index + 1}')
              title = match.group(2).strip()
              start = match.end() + (1 if master[match.end():match.end()+1] == '\n' else 0)
              end = matches[index + 1].start() if index + 1 < len(matches) else len(master)
              body = master[start:end]
              body = re.sub(r'\n\n---\n\s*$', '\n', body)
              body = body.lstrip('\n').rstrip('\n') + '\n'
              bodies.append(body.encode('utf-8'))
              slug = f'{position:02d}-{slugify(title)}'
              hero = hero_pool[index % len(hero_pool)]
              description = f'Story {position} of 57 in the Vaelinya Short Story Programme: {title}.'
              frontmatter = f'''---\ntitle: {json.dumps(title, ensure_ascii=False)}\ndescription: {json.dumps(description, ensure_ascii=False)}\nsection: "read"\nseries: "Vaelinya Short Story Programme"\narc: "Short Story Programme"\nstory_number: {position}\ntotal_stories: 57\nstatus: "ready"\npublic_url: "/read/short-stories/{slug}/"\nhero_image: "{hero}"\nhero_image_alt: "Vaelinya artwork used as the header image for this story in the initial web edition."\nrelated_world:\n  - "/world/"\nrelated_language:\n  - "/language/"\nrelated_artefacts: []\n---\n\n# {title}\n\n'''
              (out / f'{slug}.md').write_text(frontmatter + body, encoding='utf-8')

          digest = hashlib.sha256(b'\0'.join(bodies)).hexdigest()
          expected = '36a2e4c530960a5315c167bb5326f2dc9970d345b563c008a9936cf0ad194799'
          if digest != expected:
              raise SystemExit(f'Aggregate body hash mismatch: {digest}')
          Path('src/data/short-story-release-v1.generated').write_text(expected + '\n', encoding='utf-8')
          print(f'Generated 57 stories; aggregate body hash {digest}')
          PY

      - name: Install and build exact release
        if: steps.generated.outputs.done != 'true'
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit completed release back to PR branch
        if: steps.generated.outputs.done != 'true'
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/stories/short-programme src/data/short-story-release-v1.generated
          git commit -m 'Complete exact 57-story proofreading release'
          git push origin "HEAD:${HEAD_REF}"

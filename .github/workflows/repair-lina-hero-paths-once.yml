name: Repair Lina hero paths once

on:
  push:
    branches: [agent/fix-lina-hero-images]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-lina-hero-images
          fetch-depth: 0
      - name: Repair broken published story hero paths and audit story assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          lina_fixes = {
              'src/content/stories/lina/03-the-maze-that-remembers.md': ('/images/stories/lina/maze-that-remembers.webp', '/images/read/lina/lina-03-the-maze-that-remembers.webp'),
              'src/content/stories/lina/04-the-mirror-pool.md': ('/images/stories/lina/mirror-pool.webp', '/images/read/lina/lina-04-the-mirror-pool.webp'),
              'src/content/stories/lina/05-the-sleeping-tree.md': ('/images/stories/lina/sleeping-tree.webp', '/images/read/lina/lina-05-the-sleeping-tree.webp'),
              'src/content/stories/lina/06-the-song-that-found-its-voice.md': ('/images/stories/lina/song-that-found-its-voice.webp', '/images/read/lina/lina-06-the-song-that-found-its-voice.webp'),
              'src/content/stories/lina/07-the-star-that-forgot-to-shine.md': ('/images/stories/lina/star-that-forgot-to-shine.webp', '/images/read/lina/lina-07-the-star-that-forgot-to-shine.webp'),
              'src/content/stories/lina/08-the-whispering-cave.md': ('/images/stories/lina/whispering-cave.webp', '/images/read/lina/lina-08-the-whispering-cave.webp'),
          }

          changed_lina = 0
          for filename, (old, new) in lina_fixes.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'{filename}: expected exactly one stale hero path, found {text.count(old)}')
                  text = text.replace(old, new)
                  path.write_text(text, encoding='utf-8')
                  changed_lina += 1
              elif new not in text:
                  raise SystemExit(f'{filename}: neither expected old nor new hero path is present')
              asset = Path('public') / new.lstrip('/')
              if not asset.is_file():
                  raise SystemExit(f'{filename}: target hero asset missing: {asset}')

          print(f'Repaired {changed_lina} Lina hero-image references.')

          # The proofreading release reused two fable headers with the wrong extension.
          replacements = {
              '/images/read/fables/the-roof-that-waited-for-rain/hero.webp': '/images/read/fables/the-roof-that-waited-for-rain/hero.png',
              '/images/read/fables/luma-and-the-grass-that-held-sens-place/hero.webp': '/images/read/fables/luma-and-the-grass-that-held-sens-place/hero.png',
          }
          changed_programme = 0
          for path in Path('src/content/stories/short-programme').glob('*.md'):
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed_programme += 1
          print(f'Repaired {changed_programme} proofreading-release hero-image references.')

          # Global guard: every local absolute story hero_image must exist under public/.
          broken = []
          checked = 0
          for path in Path('src/content/stories').rglob('*.md'):
              text = path.read_text(encoding='utf-8')
              match = re.search(r'^hero_image:\s*["\']?(/[^"\'\n]+)["\']?\s*$', text, re.M)
              if not match:
                  continue
              hero = match.group(1)
              checked += 1
              target = Path('public') / hero.lstrip('/')
              if not target.is_file():
                  broken.append((str(path), hero))
          if broken:
              for filename, hero in broken:
                  print(f'BROKEN hero_image: {filename} -> {hero}')
              raise SystemExit(f'{len(broken)} story hero_image path(s) do not exist')
          print(f'Hero-image audit PASS: {checked} local story hero images resolve to public assets.')
          PY
      - name: Commit repaired story metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/content/stories; then
            echo 'Story hero paths already repaired; no commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/stories
          git commit -m 'Fix published story hero image paths'
          git push origin HEAD:agent/fix-lina-hero-images

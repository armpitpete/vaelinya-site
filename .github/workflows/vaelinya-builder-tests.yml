name: Vaelinya builder tests

on:
  pull_request:
    paths:
      - 'public/labs/vaelinya-builder/**'
      - 'tests/vaelinya-builder/**'
      - 'package.json'
      - '.github/workflows/vaelinya-builder-tests.yml'
  push:
    branches: [main]
    paths:
      - 'public/labs/vaelinya-builder/**'
      - 'tests/vaelinya-builder/**'
      - 'package.json'
      - '.github/workflows/vaelinya-builder-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:builder
